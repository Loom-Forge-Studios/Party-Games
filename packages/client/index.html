<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Party Games</title>
  </head>
  <body>
    <!--
      #app-canvas is where A5's table/ mounts the Three.js renderer; it sits
      behind #app-ui, which is where this package's DOM overlay (src/ui)
      mounts. Neither exists yet as a real implementation this wave — see
      docs/ARCHITECTURE.md §1's app/ui/table/camera split.
    -->
    <div id="app-canvas"></div>
    <div id="app-ui"></div>
    <script type="module">
      import { bootstrapDefault } from '/src/app/index.ts';
      import { mountTable } from '/src/app/table-mount.ts';

      const root = document.getElementById('app-ui');
      const canvasContainer = document.getElementById('app-canvas');

      // Overseer integration: mounts the real 3D table + the room's game
      // presenter on every lobby->table handoff, and unmounts cleanly if a
      // second handoff happens (e.g. leaving one game and starting another
      // in the same tab). See app/table-mount.ts for why this wiring lives
      // here rather than in any single wave's ownership.
      let mounted = null;
      bootstrapDefault(root, async (room, { connection, store }) => {
        mounted?.unmount();
        mounted = null;
        try {
          mounted = await mountTable({ canvasContainer, room, connection, store });
        } catch (err) {
          console.error('[table-mount] failed to mount game presenter', err);
        }
      });
    </script>
  </body>
</html>
